[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spartacus"
version = "0.5.0"
description = "The smallest coding agent that is still a real one."
readme = "README.md"
requires-python = ">=3.9"
# Deliberately empty, and it is the point: the harness speaks HTTP over urllib
# from the standard library and depends on nothing at all.
dependencies = []

[project.scripts]
spartacus = "spartacus.cli:main"

[tool.setuptools]
packages = ["spartacus"]
